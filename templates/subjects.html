{% extends 'base.html' %}
{% block content %}
<h1>Subjects</h1>

{% for s in subject_view %}
<h2>{{ s.name }} - {{ s.avg_pct }}%</h2>
{% for t in s.topic_rows %}
<div class="topic-row">
  {{ t.topic }} -
  <form method="post" action="{{ url_for('update_topic') }}">
    <input type="hidden" name="subject_id" value="{{ s.id }}">
    <input type="hidden" name="topic" value="{{ t.topic }}">
    <input type="number" name="percent" min="0" max="100" step="5" value="{{ t.percent }}">%
    <button type="submit">Save</button>
  </form>
</div>
{% endfor %}
<hr>
{% endfor %}

{% endblock %}
